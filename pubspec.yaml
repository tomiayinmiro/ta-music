name: ta_music
description: "TA Music - offline music player"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  # Pinned to the 2.x line, not "latest" (3.x/4.x): audiotags caps
  # freezed_annotation below 3.0.0, and every riverpod_generator version
  # compatible with riverpod_annotation 4.x requires freezed_annotation
  # ^3.0.0 — irreconcilable with audiotags. See git log for the full
  # resolver trace. Confirmed with user 2026-08-16.
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  freezed_annotation: ^2.4.4
  sqflite: ^2.4.3
  sqflite_common_ffi: ^2.4.2+1
  just_audio: ^0.10.6
  just_audio_windows: ^0.2.3
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  rxdart: ^0.28.0
  audiotags: ^1.4.5
  path_provider: ^2.1.6
  file_picker: ^12.0.0
  permission_handler: ^13.0.1
  dio: ^5.11.0
  flutter_animate: ^4.5.2
  shelf: ^1.4.2
  multicast_dns: ^0.3.3+1
  logger: ^2.7.0
  audio_service_win: ^0.0.3
  path: ^1.9.1
  image: ^4.9.2
  # ^10.x, not ^8.x: package_info_plus 8.x-9.x pins win32 ^5.5.3, which
  # conflicts with file_picker's windows_file_picker dependency (win32
  # ^6.3.0). 10.2.1+ resolves cleanly against the existing file_picker ^12.0.0.
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  riverpod_generator: 2.6.4
  freezed: 2.5.8
  build_runner: ^2.5.4
  riverpod_lint: 2.6.4
  custom_lint: ^0.7.3
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

# flutter_launcher_icons config — generates Android + Windows launcher icons
# from the custom logo. Android gets both a legacy square icon (image_path,
# full-bleed) and a proper adaptive icon (padded foreground + solid dark
# background) so masked launchers (circle/squircle) don't crop the artwork.
# Both source images are quantized + (for the foreground) alpha-recomposed
# copies produced by tool/generate_logo_assets.dart, not the raw source —
# see that script's doc comment for why (bundle size). iOS/macOS/web/linux
# are not built for this project (see CLAUDE.md's target platforms), so left
# disabled.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo/ta_music_icon_source.png"
  adaptive_icon_background: "#131313"
  adaptive_icon_foreground: "assets/images/logo/ta_music_icon_adaptive_fg.png"
  # The provided foreground is already padded to the adaptive-icon safe zone
  # (see tool/generate_logo_assets.dart) — without this, the plugin adds its
  # own default 16% inset on top, double-padding and shrinking the visible
  # logo far more than intended.
  adaptive_icon_foreground_inset: 0
  windows:
    generate: true
    image_path: "assets/images/logo/ta_music_icon_source.png"
    icon_size: 256

# flutter_native_splash config — dark background (#131313, matches
# AppColors.background/surface so the splash-to-Home transition has no
# color shift) with the logo centered, on both Android and Windows.
# android_12 targets the OS-native Android 12+ splash screen API
# separately: that surface also masks its icon into a circle, so it uses the
# same padded foreground as the adaptive launcher icon rather than the
# full-bleed source.
flutter_native_splash:
  color: "#131313"
  image: "assets/images/logo/ta_music_icon_source.png"
  android_12:
    color: "#131313"
    image: "assets/images/logo/ta_music_icon_adaptive_fg.png"
  android: true
  web: false
  # No "windows" key: flutter_native_splash only supports Android/iOS/web.
  # Windows startup is handled separately — see win32_window.cpp, which
  # already sets a null background brush (no white-flash risk) rather than
  # a custom native splash window. Approved 2026-09-08.

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  assets:
    - assets/aura/
    - assets/fallback_covers/
    - assets/fallback_covers/bible/
    - assets/images/logo/ta_music_icon.png

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Variable.ttf
    - family: Hanken Grotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk-Variable.ttf
